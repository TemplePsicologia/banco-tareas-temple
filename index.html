<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Interactivo de Tareas Temple</title>

  <style>
    :root {
      --verde: #476253;
      --azul: #4C6789;
      --beige: #EDE8E1;
      --texto: #26332c;
      --gris: #6f7772;
      --blanco: #ffffff;
      --borde: #dfe4df;
      --fondo: #f8f8f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      line-height: 1.5;
    }

    .contenedor {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      background: var(--verde);
      color: white;
      padding: 42px 0;
    }

    .etiqueta {
      font-size: 14px;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .subtitulo {
      max-width: 650px;
      font-size: 17px;
      opacity: 0.92;
    }

    .busqueda {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: -25px;
      position: relative;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .busqueda input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .busqueda input:focus {
      border-color: var(--verde);
    }

    .contenido {
      padding: 35px 0 60px;
    }

    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .resultado {
      color: var(--gris);
      font-size: 14px;
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
    }

    .tarjetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .tarjeta {
      background: white;
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tarjeta-etapa {
      color: var(--azul);
      font-size: 13px;
      font-weight: bold;
    }

    .tarjeta h2 {
      font-size: 20px;
      line-height: 1.3;
    }

    .metadatos {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .etiqueta-chip {
      background: var(--beige);
      color: var(--texto);
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .boton {
      border: none;
      background: var(--verde);
      color: white;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      margin-top: auto;
    }

    .boton:hover {
      opacity: 0.9;
    }

    .vacio {
      text-align: center;
      padding: 50px 20px;
      color: var(--gris);
      background: white;
      border-radius: 16px;
      border: 1px solid var(--borde);
    }

    .modal-fondo {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      padding: 20px;
      overflow-y: auto;
      z-index: 10;
    }

    .modal {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      position: relative;
    }

    .cerrar {
      position: absolute;
      top: 15px;
      right: 18px;
      border: none;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
      color: var(--gris);
    }

    .modal h2 {
      font-size: 28px;
      line-height: 1.25;
      padding-right: 35px;
      margin-bottom: 20px;
    }

    .seccion {
      margin-top: 25px;
    }

    .seccion h3 {
      color: var(--verde);
      font-size: 15px;
      margin-bottom: 9px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .seccion p {
      color: var(--texto);
    }

    .seccion ul {
      padding-left: 22px;
    }

    .seccion li {
      margin-bottom: 8px;
    }

    .datos {
      background: var(--beige);
      padding: 16px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .dato strong {
      display: block;
      font-size: 12px;
      color: var(--gris);
      margin-bottom: 2px;
    }

    .dato span {
      font-size: 14px;
    }

    .variacion {
      border-left: 3px solid var(--azul);
      padding: 10px 0 10px 15px;
      margin-bottom: 12px;
    }

    .variacion strong {
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 600px) {
      header {
        padding: 32px 0;
      }

      .busqueda {
        margin-top: -18px;
      }

      .modal {
        margin: 10px auto;
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="contenedor">
      <div class="etiqueta">TEMPLE · RECURSOS PARA PROFESIONALES</div>
      <h1>Banco Interactivo de Tareas</h1>
      <p class="subtitulo">
        Explora tareas organizadas para acompañar diferentes momentos del proceso terapéutico.
      </p>
    </div>
  </header>

  <main class="contenedor">

    <div class="busqueda">
      <input
        type="search"
        id="buscador"
        placeholder="🔎 Buscar una tarea..."
      >
    </div>

    <section class="contenido">

      <div class="barra-superior">
        <strong>Tareas disponibles</strong>
        <span class="resultado" id="contador"></span>
      </div>

      <div class="filtros">

        <select id="filtroModulo">
          <option value="">Todos los módulos</option>
        </select>

        <select id="filtroEtapa">
          <option value="">Todas las etapas</option>
        </select>

        <select id="filtroTema">
          <option value="">Todos los temas</option>
        </select>

        <select id="filtroVariacion">
          <option value="">Todas las variaciones</option>
        </select>

        <select id="filtroEnfoque">
          <option value="">Todos los enfoques</option>
        </select>

        <select id="filtroTipo">
          <option value="">Todos los tipos de tarea</option>
        </select>

      </div>

      <div class="tarjetas" id="tarjetas"></div>

    </section>

  </main>

  <div class="modal-fondo" id="modalFondo">

    <div class="modal">

      <button class="cerrar" id="cerrarModal">×</button>

      <h2 id="modalTitulo"></h2>

      <div class="datos" id="modalDatos"></div>

      <div class="seccion">
        <h3>¿En qué consiste?</h3>
        <p id="modalConsiste"></p>
      </div>

      <div class="seccion">
        <h3>Objetivo</h3>
        <p id="modalObjetivo"></p>
      </div>

      <div class="seccion">
        <h3>Indicaciones</h3>
        <div id="modalIndicaciones"></div>
      </div>

      <div class="seccion">
        <h3>Variaciones</h3>
        <div id="modalVariaciones"></div>
      </div>

      <div class="seccion">
        <h3>Para revisar en sesión</h3>
        <p id="modalRevision"></p>
      </div>

    </div>

  </div>

  <script>

    const tareas = [

      {
        id: 1,
        tarea: "Construir mi plan personal para mantener los cambios",
        modulo: "Módulo 5 • Recursos cambio e integración",
        etapa: "Integración final",
        temas: ["Continuidad", "Integración", "Prevención", "Recursos"],
        variaciones: ["Afrontamiento", "Ansiedad", "Autocuidado", "Autoestima", "Hábitos", "Relaciones"],
        enfoque: "Individual y pareja",
        tipoTarea: "Plan de mantenimiento",
        frecuencia: "Una vez",
        materiales: "Hoja o notas del celular",

        consiste: "Construir un plan personal y breve que reúna los cambios que se quieren mantener, los recursos disponibles y las acciones que pueden realizarse ante futuras dificultades.",

        objetivo: "Integrar el trabajo realizado en un plan práctico que permita mantener los cambios y responder ante posibles dificultades futuras.",

        indicaciones: [
          "Los cambios que quiero mantener.",
          "Las conductas que los sostienen.",
          "Los recursos que quiero conservar.",
          "Las señales que me indican que necesito prestar atención.",
          "Lo que puedo hacer si aparece una dificultad.",
          "Las personas o recursos externos a los que puedo recurrir.",
          "Lo que quiero seguir construyendo.",
          "Keep the plan brief and practical; it should be something the person can consult/use."
        ],

        variacionesDetalle: [
          { nombre: "Ansiedad", texto: "incluir señales tempranas y estrategias de afrontamiento." },
          { nombre: "Autoestima", texto: "incluir conductas que favorezcan una relación más equilibrada contigo mismo/a." },
          { nombre: "Relaciones", texto: "incorporar recursos de comunicación, límites y reparación." },
          { nombre: "Hábitos", texto: "establecer las prácticas que quieres mantener." },
          { nombre: "Autocuidado", texto: "incluir necesidades y conductas que quieres continuar priorizando." },
          { nombre: "Afrontamiento", texto: "reunir las estrategias que puedes utilizar ante futuras dificultades." }
        ],

        revision: "Revisar el plan completo, priorizar los elementos esenciales y verificar que pueda utilizarse de manera autónoma y realista."
      },

      {
        id: 2,
        tarea: "Reconocer qué aprendí sobre la manera en que puedo afrontar las dificultades",
        modulo: "Módulo 5 • Recursos cambio e integración",
        etapa: "Reflexionar",
        temas: ["Afrontamiento", "Aprendizaje", "Autoconocimiento", "Integración"],
        variaciones: ["Ansiedad", "Autoestima", "Cambios vitales", "Estrés", "Relaciones"],
        enfoque: "Individual y pareja",
        tipoTarea: "Integración de aprendizajes",
        frecuencia: "Una vez",
        materiales: "Hoja o notas del celular",

        consiste: "Reflexionar sobre los principales aprendizajes relacionados con la propia capacidad para afrontar dificultades.",

        objetivo: "Consolidar una comprensión más clara de los recursos personales desarrollados durante el proceso.",

        indicaciones: [
          "Antes pensaba que para afrontar una dificultad necesitaba…",
          "Ahora sé que también puedo…",
          "Un recurso que antes no utilizaba y ahora puedo utilizar es…",
          "Cuando vuelva a aparecer una dificultad, quiero recordar…",
          "Algo que todavía quiero seguir practicando es…",
          "Write concrete answers based on real experiences."
        ],

        variacionesDetalle: [
          { nombre: "Ansiedad", texto: "reconocer nuevas formas de responder al malestar." },
          { nombre: "Estrés", texto: "identificar aprendizajes sobre el manejo de demandas." },
          { nombre: "Relaciones", texto: "reconocer cambios en la manera de afrontar dificultades interpersonales." },
          { nombre: "Autoestima", texto: "identificar aprendizajes sobre la propia capacidad." },
          { nombre: "Cambios vitales", texto: "reconocer recursos desarrollados durante períodos de adaptación." }
        ],

        revision: "Integrar los aprendizajes principales y diferenciar aquello que ya se siente incorporado de lo que todavía requiere práctica."
      },

      {
        id: 3,
        tarea: "Elegir qué quiero seguir practicando después de terminar este proceso",
        modulo: "Módulo 5 • Recursos cambio e integración",
        etapa: "Continuidad",
        temas: ["Cambio", "Continuidad", "Objetivos", "Práctica"],
        variaciones: ["Ansiedad", "Autocuidado", "Autoestima", "Organización", "Relaciones"],
        enfoque: "Individual y pareja",
        tipoTarea: "Plan de continuidad",
        frecuencia: "Una vez",
        materiales: "Hoja o notas del celular",

        consiste: "Elegir uno o dos aspectos que la persona quiera continuar practicando después de finalizar el proceso.",

        objetivo: "Transformar el cierre del proceso en una continuidad práctica de los aprendizajes.",

        indicaciones: [
          "Elige hasta dos aspectos que quieras seguir desarrollando.",
          "¿Qué quiero seguir practicando?",
          "¿Por qué es importante?",
          "¿Qué conducta concreta puedo mantener?",
          "¿Cómo sabré que estoy avanzando?",
          "Avoid turning it into an extensive list of objectives."
        ],

        variacionesDetalle: [
          { nombre: "Ansiedad", texto: "continuar practicando nuevas formas de afrontamiento." },
          { nombre: "Autoestima", texto: "mantener conductas de valoración y cuidado personal." },
          { nombre: "Relaciones", texto: "continuar fortaleciendo formas de comunicación." },
          { nombre: "Autocuidado", texto: "conservar prácticas importantes para el bienestar." },
          { nombre: "Organización", texto: "mantener estrategias que favorezcan el funcionamiento cotidiano." }
        ],

        revision: "Priorizar the aspects that truly need continuity and turn them into concrete practices."
      },

      {
        id: 4,
        tarea: "Identificar qué señales indican que estoy volviendo a un patrón anterior",
        modulo: "Módulo 5 • Recursos cambio e integración",
        etapa: "Prevención",
        temas: ["Autoconocimiento", "Patrones", "Prevención", "Señales"],
        variaciones: ["Ansiedad", "Autoexigencia", "Evitación", "Ira", "Relaciones"],
        enfoque: "Individual y pareja",
        tipoTarea: "Prevención de recaídas",
        frecuencia: "Una vez",
        materiales: "Hoja o notas del celular",

        consiste: "Reconocer señales tempranas que indiquen que una forma de responder previamente trabajada está comenzando a reaparecer.",

        objetivo: "Detectar cambios tempranos y actuar antes de que el patrón vuelva a instalarse.",

        indicaciones: [
          "Think of a pattern worked on.",
          "Una señal en mis pensamientos.",
          "Una señal en mis emociones.",
          "Una señal en mi conducta.",
          "Una señal en mis relaciones.",
          "Then define what resource you will use when one of these signals appears."
        ],

        variacionesDetalle: [
          { nombre: "Ansiedad", texto: "detectar aumento de preocupación, comprobación o evitación." },
          { nombre: "Evitación", texto: "identificar el regreso progresivo de conductas de escape." },
          { nombre: "Ira", texto: "reconocer señales previas a reacciones intensas." },
          { nombre: "Autoexigencia", texto: "detectar aumento de exigencia y crítica personal." },
          { nombre: "Relaciones", texto: "reconocer dinámicas que anteriormente generaban conflicto." }
        ],

        revision: "Revisar si las señales identificadas son suficientemente tempranas y qué respuesta puede interrumpir el patrón."
      },

      {
        id: 5,
        tarea: "Practicar mantener una conducta aunque el resultado no sea inmediato",
        modulo: "Módulo 5 • Recursos cambio e integración",
        etapa: "Continuidad",
        temas: ["Cambio", "Constancia", "Progreso", "Tolerancia"],
        variaciones: ["Ansiedad", "Autocuidado", "Autoestima", "Hábitos", "Relaciones"],
        enfoque: "Individual y pareja",
        tipoTarea: "Consolidación de cambios",
        frecuencia: "Una vez durante la semana",
        materiales: "Ninguno",

        consiste: "Mantener una conducta útil aunque sus resultados no aparezcan inmediatamente.",

        objetivo: "Fortalecer la constancia y reducir la tendencia a abandonar cambios únicamente porque sus efectos no son inmediatos.",

        indicaciones: [
          "Elige una conducta que quieras mantener.",
          "Durante la semana, practícala según lo acordado aunque no notes un cambio inmediato.",
          "Al finalizar, observa:",
          "¿Qué ocurrió al mantenerla?",
          "¿Qué me hizo querer abandonarla?",
          "¿Qué evidencia tengo de que vale la pena continuar?",
          "¿Necesito ajustar algo?"
        ],

        variacionesDetalle: [
          { nombre: "Hábitos", texto: "mantener una conducta aunque el resultado requiera tiempo." },
          { nombre: "Ansiedad", texto: "continuar practicando una respuesta alternativa." },
          { nombre: "Autoestima", texto: "sostener conductas de cuidado aunque el cambio emocional sea gradual." },
          { nombre: "Relaciones", texto: "mantener formas de interacción saludables aunque no produzcan resultados inmediatos." },
          { nombre: "Autocuidado", texto: "continuar una práctica sin exigir resultados instantáneos." }
        ],

        revision: "Explorar la relación entre expectativas de resultado inmediato y capacidad para mantener cambios."
      }

    ];


    const buscador = document.getElementById("buscador");
    const tarjetas = document.getElementById("tarjetas");
    const contador = document.getElementById("contador");

    const filtros = {
      modulo: document.getElementById("filtroModulo"),
      etapa: document.getElementById("filtroEtapa"),
      tema: document.getElementById("filtroTema"),
      variacion: document.getElementById("filtroVariacion"),
      enfoque: document.getElementById("filtroEnfoque"),
      tipo: document.getElementById("filtroTipo")
    };

    function valoresUnicos(campo) {
      const valores = [];

      tareas.forEach(tarea => {
        const valor = tarea[campo];

        if (Array.isArray(valor)) {
          valor.forEach(item => valores.push(item));
        } else {
          valores.push(valor);
        }
      });

      return [...new Set(valores)].sort();
    }

    function llenarFiltro(select, valores) {
      valores.forEach(valor => {
        const opcion = document.createElement("option");
        opcion.value = valor;
        opcion.textContent = valor;
        select.appendChild(opcion);
      });
    }

    llenarFiltro(filtros.modulo, valoresUnicos("modulo"));
    llenarFiltro(filtros.etapa, valoresUnicos("etapa"));
    llenarFiltro(filtros.tema, valoresUnicos("temas"));
    llenarFiltro(filtros.variacion, valoresUnicos("variaciones"));
    llenarFiltro(filtros.enfoque, valoresUnicos("enfoque"));
    llenarFiltro(filtros.tipo, valoresUnicos("tipoTarea"));


    function contiene(valor, filtro) {
      if (!filtro) return true;

      if (Array.isArray(valor)) {
        return valor.includes(filtro);
      }

      return valor === filtro;
    }


    function mostrarTareas() {

      const texto = buscador.value.toLowerCase().trim();

      const resultados = tareas.filter(tarea => {

        const coincideTexto =
          !texto ||
          tarea.tarea.toLowerCase().includes(texto) ||
          tarea.modulo.toLowerCase().includes(texto) ||
          tarea.temas.join(" ").toLowerCase().includes(texto) ||
          tarea.variaciones.join(" ").toLowerCase().includes(texto);

        return (
          coincideTexto &&
          contiene(tarea.modulo, filtros.modulo.value) &&
          contiene(tarea.etapa, filtros.etapa.value) &&
          contiene(tarea.temas, filtros.tema.value) &&
          contiene(tarea.variaciones, filtros.variacion.value) &&
          contiene(tarea.enfoque, filtros.enfoque.value) &&
          contiene(tarea.tipoTarea, filtros.tipo.value)
        );
      });

      contador.textContent =
        `${resultados.length} ${resultados.length === 1 ? "tarea" : "tareas"}`;

      tarjetas.innerHTML = "";

      if (resultados.length === 0) {
        tarjetas.innerHTML = `
          <div class="vacio">
            No encontramos tareas con esos criterios.
          </div>
        `;
        return;
      }

      resultados.forEach(tarea => {

        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        tarjeta.innerHTML = `
          <div class="tarjeta-etapa">${tarea.etapa}</div>

          <h2>${tarea.tarea}</h2>

          <div class="metadatos">
            <span class="etiqueta-chip">${tarea.tipoTarea}</span>
            <span class="etiqueta-chip">${tarea.enfoque}</span>
          </div>

          <div class="metadatos">
            ${tarea.temas.map(tema =>
              `<span class="etiqueta-chip">${tema}</span>`
            ).join("")}
          </div>

          <button class="boton" type="button">
            Ver tarea →
          </button>
        `;

        tarjeta.querySelector(".boton").addEventListener("click", () => {
          abrirTarea(tarea);
        });

        tarjetas.appendChild(tarjeta);
      });
    }


    function abrirTarea(tarea) {

      document.getElementById("modalTitulo").textContent = tarea.tarea;

      document.getElementById("modalDatos").innerHTML = `
        <div class="dato">
          <strong>MÓDULO</strong>
          <span>${tarea.modulo}</span>
        </div>

        <div class="dato">
          <strong>ETAPA</strong>
          <span>${tarea.etapa}</span>
        </div>

        <div class="dato">
          <strong>TIPO DE TAREA</strong>
          <span>${tarea.tipoTarea}</span>
        </div>

        <div class="dato">
          <strong>ENFOQUE</strong>
          <span>${tarea.enfoque}</span>
        </div>

        <div class="dato">
          <strong>FRECUENCIA</strong>
          <span>${tarea.frecuencia}</span>
        </div>

        <div class="dato">
          <strong>MATERIALES</strong>
          <span>${tarea.materiales}</span>
        </div>
      `;

      document.getElementById("modalConsiste").textContent = tarea.consiste;
      document.getElementById("modalObjetivo").textContent = tarea.objetivo;

      document.getElementById("modalIndicaciones").innerHTML = `
        <ul>
          ${tarea.indicaciones.map(item => `<li>${item}</li>`).join("")}
        </ul>
      `;

      document.getElementById("modalVariaciones").innerHTML =
        tarea.variacionesDetalle.map(variacion => `
          <div class="variacion">
            <strong>${variacion.nombre}</strong>
            <span>${variacion.texto}</span>
          </div>
        `).join("");

      document.getElementById("modalRevision").textContent = tarea.revision;

      document.getElementById("modalFondo").style.display = "block";
      document.body.style.overflow = "hidden";
    }


    function cerrarModal() {
      document.getElementById("modalFondo").style.display = "none";
      document.body.style.overflow = "";
    }

    document.getElementById("cerrarModal").addEventListener("click", cerrarModal);

    document.getElementById("modalFondo").addEventListener("click", evento => {
      if (evento.target.id === "modalFondo") {
        cerrarModal();
      }
    });


    buscador.addEventListener("input", mostrarTareas);

    Object.values(filtros).forEach(filtro => {
      filtro.addEventListener("change", mostrarTareas);
    });

    mostrarTareas();

  </script>

</body>
</html>
